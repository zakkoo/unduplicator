[package]
name = "unduplicator"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Resumable, copy-only SHA-256 file importer"
license = "MIT"

[features]
test-failpoints = []

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
fs2 = "0.4"
libc = "0.2"
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

